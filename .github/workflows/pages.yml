name: Publish Sakariya Directory
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "data/sources.json"
      - "data/newspaper-index.json"
      - "newspaper/**"
      - "scripts/build.py"
      - "scripts/archive_search.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build source directory
        run: python3 scripts/build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
